    <div class="form">
    <h2>お問い合わせ</h2>
    <form>
        <label for="fname" >お名前 [必須]</label>
        <input type="text" id="fname" name="fname">
    <br><br>
        <label for="address" value="">メールアドレス [必須]</label>
